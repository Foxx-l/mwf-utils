name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly run to catch upstream dependency drift (discord.js minors, etc.)
    - cron: '0 6 * * 1'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
